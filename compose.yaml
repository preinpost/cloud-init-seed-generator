services:
  seed-generator:
    build: 
      context: .
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    image: ghcr.io/preinpost/seed-generator:${TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - /tmp:/tmp
    restart: unless-stopped